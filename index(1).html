<style>
/* Layout: Carbon-style UI shell. Black header band, 16-column-inspired grid, flat tiles, accordion catalogue with side-nav filters. */
:root {
  /* Carbon Gray 10 theme */
  --background: #f4f4f4;
  --layer: #ffffff;
  --layer-accent: #e0e0e0;
  --layer-hover: #e8e8e8;
  --layer-selected: #e0e0e0;
  --field: #ffffff;
  --text-primary: #161616;
  --text-secondary: #525252;
  --text-helper: #6f6f6f;
  --text-on-color: #ffffff;
  --border-subtle: #e0e0e0;
  --border-strong: #8d8d8d;
  --interactive: #0f62fe;
  --button-primary: #0f62fe;
  --button-primary-hover: #0050e6;
  --link: #0f62fe;
  --focus: #0f62fe;
  --inverse: #161616;
  --text-inverse: #ffffff;
  --tag-bg: #e0e0e0;
  --support-success: #24a148;
  /* Shell header is #161616 in every theme */
  --shell: #161616;
  --shell-text: #f4f4f4;
  --shell-muted: #c6c6c6;
  --shell-border: #393939;
  --shell-hover: #2c2c2c;
  /* Carbon categorical palette, light */
  --t1: #6929c4; --t2: #1192e8; --t3: #005d5d; --t4: #9f1853; --t5: #fa4d56; --t6: #570408;
  --font-sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "IBM Plex Sans", "Geeza Pro", Tahoma, sans-serif;
  --font-mono: "IBM Plex Mono", "Menlo", "DejaVu Sans Mono", Courier, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* Carbon Gray 100 theme */
    --background: #161616; --layer: #262626; --layer-accent: #393939; --layer-hover: #333333; --layer-selected: #393939;
    --field: #262626; --text-primary: #f4f4f4; --text-secondary: #c6c6c6; --text-helper: #a8a8a8; --text-on-color: #ffffff;
    --border-subtle: #393939; --border-strong: #6f6f6f; --interactive: #4589ff; --button-primary: #0f62fe; --button-primary-hover: #0050e6;
    --link: #78a9ff; --focus: #ffffff; --inverse: #f4f4f4; --text-inverse: #161616; --tag-bg: #393939; --support-success: #42be65;
    --t1: #8a3ffc; --t2: #33b1ff; --t3: #007d79; --t4: #ff7eb6; --t5: #fa4d56; --t6: #fff1f1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: #161616; --layer: #262626; --layer-accent: #393939; --layer-hover: #333333; --layer-selected: #393939;
  --field: #262626; --text-primary: #f4f4f4; --text-secondary: #c6c6c6; --text-helper: #a8a8a8; --text-on-color: #ffffff;
  --border-subtle: #393939; --border-strong: #6f6f6f; --interactive: #4589ff; --button-primary: #0f62fe; --button-primary-hover: #0050e6;
  --link: #78a9ff; --focus: #ffffff; --inverse: #f4f4f4; --text-inverse: #161616; --tag-bg: #393939; --support-success: #42be65;
  --t1: #8a3ffc; --t2: #33b1ff; --t3: #007d79; --t4: #ff7eb6; --t5: #fa4d56; --t6: #fff1f1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--background); color: var(--text-primary);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.43; letter-spacing: 0.16px;
  padding-block: 0 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--shell); }
html[lang="ar"] body { font-family: var(--font-ar); letter-spacing: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1312px; margin-inline: auto; display: grid; gap: 64px; padding-block: 48px 64px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 400; }
h2 { font-size: 1.75rem; line-height: 1.29; }
h3 { font-size: 1rem; line-height: 1.5; font-weight: 600; letter-spacing: 0; }
p { margin: 0; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.mono, .code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0.32px; }
.code { unicode-bidi: isolate; direction: ltr; }
.label { font-size: 0.75rem; line-height: 1.33; letter-spacing: 0.32px; color: var(--text-secondary); }
.lede { color: var(--text-secondary); max-width: 65ch; font-size: 1rem; line-height: 1.5; }
.section-head { display: grid; gap: 8px; margin-bottom: 24px; }
svg.icon { width: 16px; height: 16px; fill: currentColor; flex: none; }

/* UI shell header */
.shell { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--shell); color: var(--shell-text); border-bottom: 1px solid var(--shell-border); }
.shell-inner { max-width: 1312px; margin-inline: auto; height: 48px; display: flex; align-items: stretch; }
.shell-name { display: flex; align-items: center; padding-inline-end: 32px; white-space: nowrap; font-size: 0.875rem; color: var(--shell-text); }
.shell-name b { font-weight: 600; margin-inline-start: 4px; }
.shell-nav { display: flex; align-items: stretch; border-inline-start: 1px solid var(--shell-border); }
.shell-nav a { display: flex; align-items: center; padding: 0 16px; color: var(--shell-muted); font-size: 0.875rem; text-decoration: none; }
.shell-nav a:hover { background: var(--shell-hover); color: var(--shell-text); }
.shell-actions { margin-inline-start: auto; display: flex; align-items: stretch; }
.shell-actions button { border: 0; background: transparent; color: var(--shell-muted); font: inherit; font-size: 0.875rem; padding: 0 16px; cursor: pointer; min-width: 48px; }
.shell-actions button:hover { background: var(--shell-hover); color: var(--shell-text); }
.shell-actions button[aria-pressed="true"] { color: var(--shell-text); box-shadow: inset 0 -3px 0 #0f62fe; }
.shell-actions button:last-child { font-family: var(--font-ar); }
.shell :focus-visible { outline: 2px solid #ffffff; outline-offset: -2px; }

/* Identity */
.identity { display: grid; gap: 32px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: end; }
.identity h1 { font-size: clamp(2.6rem, 6vw, 3.75rem); line-height: 1.17; font-weight: 300; letter-spacing: 0; margin-top: 8px; }
html[lang="ar"] .identity h1 { font-weight: 400; }
.identity .degree { font-size: 1.25rem; line-height: 1.4; margin-top: 16px; }
.identity .uni { color: var(--text-secondary); margin-top: 4px; font-size: 1rem; }
.links { display: flex; flex-wrap: wrap; gap: 1px; margin-top: 32px; }
.btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 32px; min-height: 48px; padding: 0 16px; border: 1px solid transparent; font: inherit; font-size: 0.875rem; cursor: pointer; text-decoration: none; letter-spacing: 0.16px; }
.btn:hover { text-decoration: none; }
.btn.primary { background: var(--button-primary); color: var(--text-on-color); padding-inline-end: 16px; min-width: 200px; }
.btn.primary:hover { background: var(--button-primary-hover); }
.btn.tertiary { background: transparent; color: var(--interactive); border-color: var(--interactive); }
.btn.tertiary:hover { background: var(--interactive); color: var(--text-on-color); }
.btn.ghost { background: transparent; color: var(--link); min-height: 40px; }
.btn.ghost:hover { background: var(--layer-hover); }
.btn.static { background: var(--layer); color: var(--text-primary); cursor: text; user-select: all; }
html[dir="rtl"] .btn svg { transform: scaleX(-1); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--border-subtle); border: 1px solid var(--border-subtle); }
.fact { padding: 16px; display: grid; gap: 4px; background: var(--layer); min-height: 112px; align-content: space-between; }
.fact b { font-size: 2.625rem; line-height: 1.2; font-weight: 300; font-variant-numeric: tabular-nums; }
.fact span { color: var(--text-secondary); font-size: 0.875rem; }

/* Ledger */
.panel { background: var(--layer); padding: 24px; }
.ledger-bar { display: flex; height: 32px; gap: 2px; }
.ledger-bar button { border: 0; padding: 0; cursor: pointer; background: var(--c); min-width: 0; }
.ledger-bar button.dim { opacity: 0.2; }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 32px; margin-top: 24px; }
.legend button { all: unset; cursor: pointer; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 8px; border-bottom: 1px solid var(--border-subtle); }
.legend button:hover { background: var(--layer-hover); }
.legend button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.legend .sw { width: 12px; height: 12px; background: var(--c); }
.legend .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 0.75rem; }
.legend button[data-active="true"] { background: var(--layer-selected); }
.legend button[data-active="true"] .lbl { font-weight: 600; }
.note { font-size: 0.75rem; line-height: 1.33; letter-spacing: 0.32px; color: var(--text-helper); margin-top: 16px; max-width: 80ch; }

/* Strength tiles */
.strengths { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--border-subtle); border: 1px solid var(--border-subtle); }
.strength { background: var(--layer); padding: 16px 16px 24px; display: grid; gap: 12px; align-content: start; }
.strength .meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-secondary); }
.strength h3 { font-size: 1.25rem; font-weight: 400; line-height: 1.4; }
.strength p { color: var(--text-secondary); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip, .tag { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 8px; border-radius: 1rem; background: var(--tag-bg); color: var(--text-primary); font: inherit; font-size: 0.75rem; letter-spacing: 0.32px; border: 0; }
.chip { cursor: pointer; }
.project > .tag { justify-self: start; }
.chip:hover { background: var(--layer-accent); box-shadow: inset 0 0 0 1px var(--border-strong); }
.chip .code { color: var(--text-secondary); }
.tag.blue { background: #d0e2ff; color: #0043ce; }
:root[data-theme="dark"] .tag.blue { background: #0043ce; color: #d0e2ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.blue { background: #0043ce; color: #d0e2ff; } }

/* Projects */
.projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.project { background: var(--layer); padding: 16px 16px 24px; display: grid; gap: 12px; align-content: start; }
.project.feature { grid-column: 1 / -1; }
.project.slot { background: transparent; outline: 1px dashed var(--border-strong); outline-offset: -1px; }
.project.slot ul { margin: 0; padding-inline-start: 18px; color: var(--text-secondary); display: grid; gap: 4px; }
.project h3 { font-size: 1.25rem; font-weight: 400; }

/* Catalogue */
.catalogue { display: grid; grid-template-columns: 256px minmax(0, 1fr); gap: 32px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); display: grid; gap: 24px; }
.field { display: grid; gap: 8px; }
.field label, .field .lbl { font-size: 0.75rem; letter-spacing: 0.32px; color: var(--text-secondary); }
.search { position: relative; }
.search svg { position: absolute; inset-inline-start: 12px; top: 12px; color: var(--text-secondary); pointer-events: none; }
.search input { font: inherit; width: 100%; height: 40px; padding: 0 16px 0 40px; border: 0; border-bottom: 1px solid var(--border-strong); background: var(--field); color: var(--text-primary); border-radius: 0; }
html[dir="rtl"] .search input { padding: 0 40px 0 16px; }
.search input:focus { outline: 2px solid var(--focus); outline-offset: -2px; }
.search input::placeholder { color: var(--text-helper); }
.switcher { display: flex; border: 1px solid var(--inverse); }
.switcher button { flex: 1 1 0; min-width: 0; font: inherit; font-size: 0.875rem; height: 40px; padding: 0 8px; border: 0; background: transparent; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
.switcher button + button { border-inline-start: 1px solid var(--border-strong); }
.switcher button:hover { background: var(--layer-hover); color: var(--text-primary); }
.switcher button[aria-pressed="true"] { background: var(--inverse); color: var(--text-inverse); }
.sidenav { display: grid; }
.sidenav button { all: unset; cursor: pointer; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 40px; padding: 4px 16px; font-size: 0.875rem; color: var(--text-secondary); border-inline-start: 3px solid transparent; }
.sidenav button:hover { background: var(--layer-hover); color: var(--text-primary); }
.sidenav button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.sidenav button[aria-pressed="true"] { background: var(--layer-selected); color: var(--text-primary); font-weight: 600; border-inline-start-color: var(--interactive); }
.sidenav .sw { width: 10px; height: 10px; background: var(--c); }
.sidenav .n { font-family: var(--font-mono); color: var(--text-helper); font-size: 0.75rem; font-weight: 400; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--layer); min-height: 48px; padding-inline-start: 16px; border-bottom: 1px solid var(--border-subtle); }
.toolbar #count { color: var(--text-secondary); }
.toolbar .tools { display: flex; flex-wrap: wrap; }

.accordion { background: var(--layer); }
.course { border-bottom: 1px solid var(--border-subtle); scroll-margin-top: 64px; }
.course summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 8px 3.6rem minmax(0, 1fr) auto auto 16px; gap: 16px; align-items: center; min-height: 48px; padding: 8px 16px; }
.course summary::-webkit-details-marker { display: none; }
.course summary:hover { background: var(--layer-hover); }
.course .sw { width: 8px; height: 8px; background: var(--c); }
.course .code { font-size: 0.75rem; color: var(--text-secondary); }
.course .name { font-size: 0.875rem; }
.course .cr { font-family: var(--font-mono); font-size: 0.75rem; white-space: nowrap; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.course .chev { transition: transform 110ms cubic-bezier(0.2, 0, 0.38, 0.9); color: var(--text-primary); }
.course[open] .chev { transform: rotate(180deg); }
.course .body { padding: 0 16px 24px calc(16px + 8px + 3.6rem + 32px); display: grid; gap: 12px; }
html[dir="rtl"] .course .body { padding: 0 calc(16px + 8px + 3.6rem + 32px) 24px 16px; }
.course .body p { max-width: 72ch; font-size: 0.875rem; line-height: 1.43; }
.course .trk { font-size: 0.75rem; color: var(--text-helper); }
.course.flash summary { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: inset 0 0 0 2px var(--interactive); } 100% { box-shadow: inset 0 0 0 2px transparent; } }
.empty { padding: 48px 16px; text-align: center; color: var(--text-secondary); background: var(--layer); }

.tablewrap { overflow-x: auto; background: var(--layer); }
table { border-collapse: collapse; width: 100%; min-width: 800px; font-size: 0.875rem; }
th, td { text-align: start; padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
th { font-weight: 600; background: var(--layer-accent); color: var(--text-primary); height: 48px; vertical-align: middle; }
tbody tr:hover td { background: var(--layer-hover); }
td.num, th.num { text-align: end; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td .dot { display: inline-block; width: 8px; height: 8px; background: var(--c); margin-inline-end: 8px; }
td.desc { min-width: 340px; color: var(--text-secondary); }
tfoot td { font-weight: 600; background: var(--layer-accent); }

/* Official record */
.record { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--border-subtle); border: 1px solid var(--border-subtle); }
.record > * { background: var(--layer); padding: 24px 16px; }
.chain { list-style: none; margin: 0; display: grid; }
.chain li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; padding-bottom: 24px; position: relative; }
.chain li .ic { color: var(--interactive); margin-top: 2px; position: relative; z-index: 1; background: var(--layer); }
.chain li:not(:last-child)::after { content: ""; position: absolute; inset-inline-start: 7.5px; top: 22px; bottom: 2px; width: 1px; background: var(--interactive); }
.chain b { display: block; font-weight: 600; font-size: 0.875rem; }
.chain span { color: var(--text-secondary); font-size: 0.75rem; letter-spacing: 0.32px; }
.record .side { display: grid; gap: 24px; align-content: start; min-width: 0; }

footer { border-top: 1px solid var(--border-subtle); padding-block: 16px; color: var(--text-helper); font-size: 0.75rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 1056px) {
  .shell-nav { display: none; }
}
@media (max-width: 880px) {
  .identity, .record { grid-template-columns: minmax(0, 1fr); }
  .strengths { grid-template-columns: minmax(0, 1fr); }
  .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .catalogue { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .sidenav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .wrap { gap: 48px; padding-block: 32px 48px; }
  .projects, .legend, .sidenav { grid-template-columns: minmax(0, 1fr); }
  .shell-name { padding-inline-end: 8px; }
  .shell-name .full { display: none; }
  .course summary { grid-template-columns: 8px 3rem minmax(0, 1fr) auto 16px; gap: 12px; }
  .course .kind { display: none; }
  .course .body, html[dir="rtl"] .course .body { padding: 0 16px 20px 16px; }
  .btn.primary { min-width: 0; flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { .course.flash summary { animation: none; } .course .chev { transition: none; } }
</style>

<header class="shell gutter">
  <div class="shell-inner">
    <span class="shell-name"><span>PPU</span><b data-i="brand"></b></span>
    <nav class="shell-nav" aria-label="Sections">
      <a href="#overview" data-i="navOverview"></a>
      <a href="#projects-section" data-i="navProjects"></a>
      <a href="#courses" data-i="navCourses"></a>
      <a href="#record" data-i="navRecord"></a>
    </nav>
    <div class="shell-actions" role="group" aria-label="Language">
      <button type="button" id="lang-en" data-lang="en">EN</button>
      <button type="button" id="lang-ar" data-lang="ar">عربي</button>
    </div>
  </div>
</header>

<div class="gutter">
<main class="wrap">
  <section class="identity" id="overview" aria-labelledby="who">

      <div class="label" data-i="eyebrow"></div>
      <h1 id="who" data-i="name"></h1>
      <p class="degree" data-i="degree"></p>
      <p class="uni" data-i="uni"></p>
      <div class="links" id="links"></div>
    </div>
    <div class="facts" id="facts"></div>
  </section>

  <section aria-labelledby="h-ledger">
    <div class="section-head">
      <h2 id="h-ledger" data-i="ledgerTitle"></h2>
      <p class="lede" data-i="ledgerLede"></p>
    </div>
    <div class="panel">
      <div class="ledger-bar" id="ledger" role="group"></div>
      <div class="legend" id="legend"></div>
      <p class="note" data-i="ledgerNote"></p>
    </div>
  </section>

  <section aria-labelledby="h-str">
    <div class="section-head">
      <h2 id="h-str" data-i="strTitle"></h2>
      <p class="lede" data-i="strLede"></p>

    <div class="strengths" id="strengths"></div>
  </section>

  <section aria-labelledby="h-proj" id="projects-section">
    <div class="section-head">
      <h2 id="h-proj" data-i="projTitle"></h2>
      <p class="lede" data-i="projLede"></p>
    </div>
    <div class="projects" id="projects"></div>
  </section>

  <section aria-labelledby="h-cat" id="courses">
    <div class="section-head">
      <h2 id="h-cat" data-i="catTitle"></h2>
      <p class="lede" data-i="catLede"></p>
    </div>
    <div class="catalogue">
      <aside class="rail">
        <div class="field">
          <label for="q" data-i="search"></label>
          <div class="search">
            <svg class="icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M29 27.586l-7.552-7.552a11.018 11.018 0 1 0-1.414 1.414L27.586 29zM4 13a9 9 0 1 1 9 9 9.01 9.01 0 0 1-9-9z"/></svg>
            <input id="q" type="search" autocomplete="off">
          </div>
        </div>

const COURSES = [
["4006",3,"f","lec","Physics 1","فيزياء 1","Physical quantities, units, vectors and scalars, motion in one dimension, motion in two dimensions, Newton's laws of motion and dynamics, work and energy, conservation of energy, conservation of linear momentum and collision, center of mass.","الكميات الفيزيائية والوحدات، المتجهات والكميات القياسية، الحركة في بعد واحد وفي بعدين، قوانين نيوتن في الحركة والديناميكا، الشغل والطاقة، حفظ الطاقة، حفظ الزخم الخطي والتصادمات، مركز الكتلة."],
["4007",1,"f","lab","Physics Lab 1","مختبر فيزياء 1","Experiments in mechanics, heat, and optics: measurement devices, parallelogram of forces, friction, spiral spring, gravitational acceleration, rigidity, linear expansion, specific heat, mechanical equivalent of heat, and experiments in geometrical optics.","تجارب في الميكانيكا والحرارة والبصريات: أدوات القياس، متوازي أضلاع القوى، الاحتكاك، النابض الحلزوني، تسارع الجاذبية، الصلابة، التمدد الطولي، الحرارة النوعية، المكافئ الميكانيكي للحرارة، وتجارب في البصريات الهندسية."],
["4506",3,"p","lec","Engineering Workshop and Industrial Safety","المشاغل الهندسية والسلامة الصناعية","Trains students in manual engineering skills such as sawing, filing, drilling, riveting, cutting and bending, which are essential for all kinds of industrialization. Students also study industrial safety and its importance, equipment and safe working conditions, materials handling and sources of risk in machinery, the risks of electricity, chemical and physical hazards, occupational diseases, fire hazards and prevention methods in welding and cutting operations, and first aid basics.","تدريب الطلبة على المهارات الهندسية اليدوية مثل النشر والبرد والثقب والبرشمة والقص والثني، وهي ضرورية لجميع أنواع التصنيع. كما يدرس الطلبة السلامة الصناعية وأهميتها، والمعدات وظروف العمل الآمنة، ومناولة المواد ومصادر الخطر في الآلات، ومخاطر الكهرباء، والمخاطر الكيميائية والفيزيائية، وأمراض المهنة، ومخاطر الحريق وطرق الوقاية منها في عمليات اللحام والقطع، وأساسيات الإسعاف الأولي."],
["4068",3,"f","lec","Physics 2","فيزياء 2","Electric charges and fields, Gauss's law, electric potential, capacitors, current, resistance and circuits, magnetic fields, Ampère's law, Faraday's law, and inductance.","الشحنات والمجالات الكهربائية، قانون غاوس، الجهد الكهربائي، المواسعات، التيار والمقاومة والدوائر، المجالات المغناطيسية، قانون أمبير، قانون فاراداي، والمحاثة."],
["4292",3,"s","lec","Computer Programming","برمجة الحاسوب","Problem solving, top-down algorithmic development and implementation in a procedural, Pascal-like programming language. Data types, structured program development, arrays, sorting and searching techniques, pointers, string processing, records and files.","حل المسائل، وتطوير الخوارزميات بأسلوب من الأعلى إلى الأسفل وتنفيذها بلغة برمجة إجرائية شبيهة بباسكال. أنواع البيانات، تطوير البرامج المهيكلة، المصفوفات، تقنيات الترتيب والبحث، المؤشرات، معالجة النصوص، السجلات والملفات."],
["4008",3,"f","lec","Chemistry 1","كيمياء 1","Matter, its properties and measurement, development of the atomic theory, stoichiometry; elements and compounds, chemical reactions, gases, thermochemistry, electrons in atoms, atomic properties and the periodic table.","المادة وخصائصها وقياسها، تطور النظرية الذرية، الحسابات الكيميائية؛ العناصر والمركبات، التفاعلات الكيميائية، الغازات، الكيمياء الحرارية، الإلكترونات في الذرات، الخصائص الذرية والجدول الدوري."],
["4009",1,"f","lab","Chemistry Lab 1","مختبر كيمياء 1","Introduction to the chemical lab and use of chemical balances, boiling point elevation, density determination, melting point, stoichiometry of two reactions, water of hydration, molecular weight of a volatile liquid, identification of six solutions, volumetrics.","مقدمة في المختبر الكيميائي واستخدام الموازين، ارتفاع درجة الغليان، تعيين الكثافة، درجة الانصهار، الحسابات الكيميائية لتفاعلين، ماء التبلور، الوزن الجزيئي لسائل متطاير، التعرف على ستة محاليل، التحليل الحجمي."],
["4010",3,"p","lec","Engineering Drawing","الرسم الهندسي","Drawing technique, the graphic language, instruments and their use, materials of drawing, drawing standards, types of lines and lettering. Geometrical constructions: dividing straight lines into equal parts and constructing perpendiculars.","تقنيات الرسم، اللغة البيانية، أدوات الرسم واستخدامها، مواد الرسم، معايير الرسم، أنواع الخطوط والكتابة. الإنشاءات الهندسية: تقسيم الخطوط المستقيمة إلى أجزاء متساوية وإنشاء الأعمدة."],
["4106",3,"e","lec","Electrical Circuits I","الدوائر الكهربائية 1","Physical foundations of electric circuits: charge, energy, power, and efficiency. Basic circuit elements: resistance, capacitance, and inductance; independent and dependent voltage and current sources. Basic DC laws of circuit theory: Ohm's law, source transformation and conversions, Kirchhoff's laws and methods of circuit analysis including nodal and mesh. Circuit theorems: superposition, Thevenin and Norton theorems. Inductance and capacitance; transient analysis of first-order RC and RL circuits. Sinusoidal sources and the concept of the phasor in AC circuit analysis; transfer functions, resonance and introduction to filters.","الأسس الفيزيائية للدوائر الكهربائية: الشحنة والطاقة والقدرة والكفاءة. عناصر الدوائر الأساسية: المقاومة والمواسعة والمحاثة، ومصادر الجهد والتيار المستقلة والتابعة. قوانين التيار المستمر الأساسية: قانون أوم، تحويل المصادر، قوانين كيرشوف وطرق تحليل الدوائر بما فيها تحليل العقد والحلقات. نظريات الدوائر: التراكب، ونظريتا ثيفنن ونورتن. المحاثة والمواسعة، والتحليل العابر لدوائر RC وRL من الرتبة الأولى. المصادر الجيبية ومفهوم الفازور في تحليل دوائر التيار المتردد؛ دوال التحويل، الرنين، ومقدمة في المرشحات."],
["4672",3,"s","lec","Data Structures","تراكيب البيانات","Review of arrays. Strings and string processing. Structures. Stack-based and queue-based arrays. Recursion. Pointers and linked lists. Stack- and queue-based linked lists. Introduction to sorting and searching techniques. Hashing techniques. Introduction to graphs and trees. Abstract data types.","مراجعة المصفوفات. النصوص ومعالجتها. التراكيب. المكدس والطابور باستخدام المصفوفات. الاستدعاء الذاتي. المؤشرات والقوائم المترابطة. المكدس والطابور باستخدام القوائم المترابطة. مقدمة في تقنيات الترتيب والبحث. تقنيات التجزئة. مقدمة في المخططات والأشجار. أنواع البيانات المجردة."],
["4043",3,"f","lec","Differential Equations","المعادلات التفاضلية","First-order differential equations. The existence and uniqueness theorem. Differential equations of higher order. The Laplace transform and its use in solving differential equations. Power series solutions of differential equations.","المعادلات التفاضلية من الرتبة الأولى. نظرية الوجود والوحدانية. المعادلات التفاضلية من رتب أعلى. تحويل لابلاس واستخدامه في حل المعادلات التفاضلية. حل المعادلات التفاضلية بالمتسلسلات."],
["4078",3,"s","lec","Programming Languages","لغات البرمجة","Introduction to programming language definition and objectives. Data types (specification and implementation), type checking, type conversion, formal definitions of language syntax. Static and dynamic storage management, subprograms. Programming language paradigms: logic languages, database languages, object-oriented languages, and Internet languages.","مقدمة في تعريف لغات البرمجة وأهدافها. أنواع البيانات (المواصفة والتنفيذ)، فحص الأنواع وتحويلها، التعريفات الصورية لقواعد اللغة. إدارة الذاكرة الساكنة والديناميكية، البرامج الفرعية. أنماط لغات البرمجة: اللغات المنطقية، لغات قواعد البيانات، اللغات الشيئية، ولغات الإنترنت."],
["4103",3,"e","lec","Electronics I","الإلكترونيات 1","Introduction to semiconductor materials: intrinsic and extrinsic types, types of carriers, drift and diffusion currents. Principles and operation of the p-n junction diode; I-V characteristics, large- and small-signal models, diode applications, other diode types; Zener diode characteristics and applications. Bipolar Junction Transistors (BJT): basic structure of npn and pnp, Ebers-Moll equations, modes of operation, DC models and biasing, AC small-signal (hybrid-π) model, mid-frequency single-stage CE, CB and CC amplifiers; differential and cascaded BJT amplifiers at low frequency; current mirrors. Field Effect Transistors (FET): JFET structure and operation, I-V characteristics and DC analysis; structure and operation of enhancement and depletion MOSFETs, I-V characteristics, DC biasing models; AC small-signal modeling of FETs at mid-band frequencies using CS, CG and CD configurations.","مقدمة في أشباه الموصلات: الأنواع النقية والمطعّمة، أنواع حاملات الشحنة، تيارات الانجراف والانتشار. مبادئ وتشغيل ثنائي الوصلة p-n؛ خصائص التيار والجهد، نماذج الإشارة الكبيرة والصغيرة، تطبيقات الثنائيات وأنواعها الأخرى؛ خصائص ثنائي زينر وتطبيقاته. الترانزستور ثنائي القطبية (BJT): البنية الأساسية لنوعي npn وpnp، معادلات إيبرز-مول، أنماط التشغيل، نماذج التيار المستمر والانحياز، نموذج الإشارة الصغيرة (hybrid-π)، مضخمات المرحلة الواحدة CE وCB وCC عند الترددات المتوسطة؛ المضخمات التفاضلية والمتتالية عند الترددات المنخفضة؛ مرايا التيار. ترانزستورات تأثير المجال (FET): بنية وتشغيل JFET وخصائصه وتحليله؛ بنية وتشغيل MOSFET بنوعيه التعزيزي والاستنزافي ونماذج انحيازه؛ نمذجة الإشارة الصغيرة باستخدام تشكيلات CS وCG وCD."],
["4693",3,"d","lec","Digital Logic Fundamentals","أساسيات المنطق الرقمي","Introduction to Boolean algebra, theorems and laws of Boolean algebra, logic gates, simplification of Boolean functions, Karnaugh maps, combinational logic circuits (adders, subtractors, code conversion, etc.). Medium-scale integration logic circuits (comparators, encoders, decoders, MUX, DeMUX, etc.).","مقدمة في الجبر البولياني ونظرياته وقوانينه، البوابات المنطقية، تبسيط الدوال البوليانية، مخططات كارنو، الدوائر المنطقية التوافقية (الجامعات، الطارحات، محولات الشيفرات وغيرها). دوائر التكامل متوسط المستوى (المقارنات، المشفرات، مفككات الشيفرة، المجمّعات والموزّعات)."],
["4704",3,"s","lec","Algorithms Design & Analysis","تصميم وتحليل الخوارزميات","Methods for algorithm analysis; design and evaluation of sorting, searching, graph and tree algorithms; dynamic programming; backtracking; NP-complete problems.","طرق تحليل الخوارزميات، وتصميم وتقييم خوارزميات الترتيب والبحث والمخططات والأشجار، البرمجة الديناميكية، التراجع (Backtracking)، ومسائل NP-complete."],
["4101",3,"e","lec","Electrical Circuits II","الدوائر الكهربائية 2","Review of sinusoidal steady state. Average, reactive and complex power, power factor, maximum power transfer theorem. Polyphase circuits: single-phase three-wire systems, three-phase Y-Y, Delta and Y-Delta connections. Two-port networks using Y, Z, T, and h parameters. Transfer functions, resonance and introduction to filters. Complex frequency and the Laplace transform: calculating natural, forced, and complete response using the s-plane. Introduction to ideal op-amp characteristics with simple applications. Nonlinear circuits, diode characteristics, clipping and rectification.","مراجعة الحالة المستقرة الجيبية. القدرة المتوسطة والردية والمركبة، معامل القدرة، نظرية أقصى نقل للقدرة. الدوائر متعددة الأطوار: الأنظمة أحادية الطور ثلاثية الأسلاك، توصيلات Y-Y ودلتا وY-دلتا ثلاثية الطور. الشبكات ثنائية المنفذ باستخدام معاملات Y وZ وT وh. دوال التحويل، الرنين، ومقدمة في المرشحات. التردد المركب وتحويل لابلاس: حساب الاستجابة الطبيعية والقسرية والكاملة في المستوى s. مقدمة في خصائص المضخم العملياتي المثالي وتطبيقاته البسيطة. الدوائر غير الخطية، خصائص الثنائي، القص والتقويم."],
["4102",1,"e","lab","Electrical Circuits Lab","مختبر الدوائر الكهربائية","Introduction to the electrical circuits lab and instruments; introduction to circuit analysis with PSpice. DC and AC techniques (Ohm's law, series and parallel circuits, Thevenin, Norton, node voltage, mesh current and maximum power transfer), op-amp circuits and characteristics, transient circuits (capacitance and inductance), oscilloscope measurements and function generator specifications.","مقدمة في مختبر الدوائر الكهربائية وأجهزته؛ مقدمة في تحليل الدوائر ببرنامج PSpice. تقنيات التيار المستمر والمتردد (قانون أوم، الدوائر على التوالي والتوازي، ثيفنن، نورتن، جهد العقد، تيار الحلقات وأقصى نقل للقدرة)، دوائر المضخم العملياتي وخصائصه، الدوائر العابرة (المواسعة والمحاثة)، القياس براسم الإشارة ومواصفات مولد الدوال."],
["4169",3,"f","lec","Linear Algebra","الجبر الخطي","Linear equations, matrices, determinants, vector spaces and subspaces, linear transformations, eigenvalues and eigenvectors, similarity of square matrices, diagonalization.","المعادلات الخطية، المصفوفات، المحددات، الفضاءات المتجهة والجزئية، التحويلات الخطية، القيم والمتجهات الذاتية، تشابه المصفوفات المربعة، والتقطير (Diagonalization)."],
["4104",3,"e","lec","Electronics II","الإلكترونيات 2","Review of small-signal amplifier models for BJT and FET; multistage (differential and cascode) amplifiers; low- and high-frequency response of BJT and FET; operational amplifier characteristics and applications. Negative feedback and active filters: low-pass, high-pass, band-pass and notch filters. Positive feedback and the Schmitt trigger, RC and tuned LC oscillators, crystal oscillators. Power amplifier classes (A, B, C and push-pull).","مراجعة نماذج مضخمات الإشارة الصغيرة لـ BJT وFET؛ المضخمات متعددة المراحل (التفاضلية وcascode)؛ الاستجابة الترددية المنخفضة والعالية؛ خصائص المضخم العملياتي وتطبيقاته. التغذية الراجعة السالبة والمرشحات الفعالة: مرشحات التمرير المنخفض والعالي والنطاقي والرافضة. التغذية الراجعة الموجبة وقادح شميت، مذبذبات RC وLC المضبوطة، والمذبذبات البلورية. أصناف مضخمات القدرة (A وB وC والدفع والسحب)."],
["4105",1,"e","lab","Electronics Lab","مختبر الإلكترونيات","Germanium and silicon diode characteristics and their applications; Zener diode characteristics and applications; junction transistor characteristics and applications such as amplification and switching circuits; operational amplifier characteristics and applications such as integrators and differentiators; 555 timer applications.","دراسة خصائص ثنائيات الجرمانيوم والسيليكون وتطبيقاتها، خصائص ثنائي زينر وتطبيقاته، خصائص الترانزستور وتطبيقاته مثل دوائر التضخيم والتبديل، خصائص المضخم العملياتي وتطبيقاته مثل المكامل والمفاضل، وتطبيقات المؤقت 555."],
["4694",3,"d","lec","Digital Systems Design","تصميم الأنظمة الرقمية","Synchronous logic circuits, flip-flops, counters (synchronous, ripple), registers, memory units, programmable logic devices (PAL, PLA), state machines, hardware description language (HDL).","الدوائر المنطقية المتزامنة، القلابات، العدادات (المتزامنة والمتموجة)، المسجلات، وحدات الذاكرة، الأجهزة المنطقية القابلة للبرمجة (PAL وPLA)، آلات الحالة، ولغة وصف العتاد (HDL)."],
["4702",3,"d","lec","Computer Organization & Architecture I","تنظيم وبنية الحاسوب 1","Introduction to organization and architecture. Computer generations. Von Neumann architecture. Bus systems and elements of bus design. PC buses. Main memory. Virtual memory. Cache memory. Input/output systems. Input/output and interrupt techniques. I/O channels and processors.","مقدمة في تنظيم الحاسوب وبنيته. أجيال الحاسوب. معمارية فون نيومان. أنظمة النواقل وعناصر تصميمها. نواقل الحاسوب الشخصي. الذاكرة الرئيسية والافتراضية والمخبئية. أنظمة الإدخال والإخراج وتقنيات المقاطعة. قنوات ومعالجات الإدخال والإخراج."],
["4706",3,"n","lec","Signals & Data Communications","الإشارات واتصالات البيانات","Basic continuous and discrete signals. Time transformation of signals. System properties (memory, linearity, stability, etc.). LTI systems. Convolution. Fourier theorems for periodic and aperiodic signals. Analog communication systems, the sampling theorem, the Z-transform. Digital modulation systems.","الإشارات المستمرة والمتقطعة الأساسية. التحويلات الزمنية للإشارات. خصائص الأنظمة (الذاكرة، الخطية، الاستقرار وغيرها). الأنظمة الخطية الثابتة زمنياً (LTI). الالتفاف. نظريات فورييه للإشارات الدورية وغير الدورية. أنظمة الاتصالات التماثلية، نظرية أخذ العينات، تحويل Z. أنظمة التعديل الرقمي."],
["4709",3,"s","lec","Object Oriented Programming","البرمجة الشيئية","Concepts of object-oriented programming. The object-oriented paradigm (the definition and use of classes along with the fundamentals of object-oriented design). Object-oriented design; encapsulation and information hiding, separation of behavior and implementation; classes, subclasses, and inheritance; polymorphism; class hierarchies. Controlling access to members.","مفاهيم البرمجة الشيئية ونمطها (تعريف الأصناف واستخدامها مع أساسيات التصميم الشيئي). التصميم الشيئي؛ التغليف وإخفاء المعلومات، فصل السلوك عن التنفيذ؛ الأصناف والأصناف الفرعية والوراثة؛ تعدد الأشكال؛ هرميات الأصناف. التحكم بالوصول إلى الأعضاء."],
["4915",1,"d","lab","Digital Systems Lab","مختبر الأنظمة الرقمية","Practical experiments on the combinational and sequential logic systems covered in the Digital Logic Fundamentals and Digital Systems Design courses.","تجارب عملية على الأنظمة المنطقية التوافقية والتتابعية التي يتناولها مساقا أساسيات المنطق الرقمي وتصميم الأنظمة الرقمية."],
["4071",3,"f","lec","Probability & Statistics","الاحتمالات والإحصاء","Descriptive statistics, probability, conditional probability and Bayes' theorem, discrete and continuous random variables, probability distributions, joint probability distributions, correlation coefficient, sampling distributions, estimation theory, testing statistical hypotheses.","الإحصاء الوصفي، الاحتمالات، الاحتمال الشرطي ونظرية بايز، المتغيرات العشوائية المتقطعة والمستمرة، التوزيعات الاحتمالية والتوزيعات المشتركة، معامل الارتباط، توزيعات المعاينة، نظرية التقدير، واختبار الفرضيات الإحصائية."],
["4703",3,"d","lec","Computer Organization & Architecture II","تنظيم وبنية الحاسوب 2","Instruction formats. Instruction sets. Addressing modes. Assembly language. CPU structure and register organization. Pipelining. RISC organization. CISC organization. Superscalar processors. Control unit. Multiprocessor systems. Parallel processing and data flow.","صيغ التعليمات ومجموعاتها. أنماط العنونة. لغة التجميع. بنية وحدة المعالجة المركزية وتنظيم المسجلات. خط الأنابيب. تنظيم RISC وCISC. المعالجات فائقة التدرج. وحدة التحكم. الأنظمة متعددة المعالجات. المعالجة المتوازية وتدفق البيانات."],
["4705",3,"s","lec","Operating Systems","أنظمة التشغيل","Review of computer architectures. Basic concepts of software, hardware and operating system components. Processing and process management. CPU scheduling, memory management, virtual memory concepts, data management and protection. Deadlocks. Projects and case studies in different operating systems.","مراجعة معماريات الحاسوب. المفاهيم الأساسية للبرمجيات والعتاد ومكونات نظام التشغيل. المعالجة وإدارة العمليات. جدولة المعالج، إدارة الذاكرة، مفاهيم الذاكرة الافتراضية، إدارة البيانات وحمايتها. الجمود (Deadlocks). مشاريع ودراسات حالة على أنظمة تشغيل مختلفة."],
["4730",3,"s","lec","Software Engineering","هندسة البرمجيات","Fundamentals and basic system theory in the technology of software engineering. Life cycle, planning, requirements analysis, requirements specification, system design, testing, documentation, management of the development process.","الأسس ونظرية الأنظمة في تقنيات هندسة البرمجيات. دورة الحياة، التخطيط، تحليل المتطلبات وتوصيفها، تصميم النظام، الاختبار، التوثيق، وإدارة عملية التطوير."],
["4044",3,"p","lec","Control Systems","أنظمة التحكم","Introduction, mathematical models of systems in the frequency domain, state variable models, feedback control system characteristics, the performance of feedback control systems, the stability of linear feedback systems, the root locus method, applications.","مقدمة، النماذج الرياضية للأنظمة في المجال الترددي، نماذج متغيرات الحالة، خصائص أنظمة التحكم بالتغذية الراجعة وأداؤها، استقرار الأنظمة الخطية ذات التغذية الراجعة، طريقة المحل الهندسي للجذور، وتطبيقات."],
["4096",3,"f","lec","Numerical Analysis","التحليل العددي","Errors, Taylor's theorem, solution of equations in one variable, interpolation and polynomial approximation, numerical differentiation and numerical integration, numerical solution of boundary value problems.","الأخطاء، نظرية تايلور، حل المعادلات في متغير واحد، الاستيفاء والتقريب بكثيرات الحدود، التفاضل والتكامل العدديان، والحل العددي لمسائل القيم الحدية."],
["4710",3,"n","lec","Database Systems","أنظمة قواعد البيانات","Database concepts, relational models. Data normalization, data description, data manipulation languages and query design, construction of database systems. ER models, introduction to SQL, database security.","مفاهيم قواعد البيانات والنماذج العلائقية. تطبيع البيانات، وصف البيانات، لغات معالجة البيانات وتصميم الاستعلامات، بناء أنظمة قواعد البيانات. نماذج الكيان والعلاقة، مقدمة في SQL، وأمن قواعد البيانات."],
["4728",3,"d","lec","Introduction to Microprocessors","مقدمة في المعالجات الدقيقة","An overview of microprocessors and their classifications, microprocessor-based systems, internal architecture of an 8-bit microprocessor, memory interfacing, memory map, input/output interfacing, microprocessor programming, simple project.","نظرة عامة على المعالجات الدقيقة وتصنيفاتها، الأنظمة المبنية على المعالجات، البنية الداخلية لمعالج 8-بت، ربط الذاكرة وخريطتها، ربط الإدخال والإخراج، برمجة المعالج، ومشروع بسيط."],
["4337",1,"d","lab","Microprocessors Lab","مختبر المعالجات الدقيقة","Experiments on 8-bit microprocessors. Memory and input/output interfacing.","تجارب على معالجات 8-بت. ربط الذاكرة ووحدات الإدخال والإخراج."],
["4357",3,"d","lec","Advanced Microprocessors","المعالجات الدقيقة المتقدمة","An overview of 16-bit and 32-bit microprocessors; detailed study of a 16-bit microprocessor (memory interfacing, I/O interfacing, interrupts, etc.) and a similar study of a 32-bit microprocessor.","نظرة عامة على معالجات 16-بت و32-بت، ودراسة تفصيلية لمعالج 16-بت (ربط الذاكرة والإدخال والإخراج والمقاطعات وغيرها)، ودراسة مماثلة لمعالج 32-بت."],
["4708",3,"s","lec","Systems Programming","برمجة الأنظمة","Principles of assemblers, principles of loaders. Static and dynamic linkers. Microprocessors, project.","مبادئ المجمّعات (Assemblers) والمحمّلات (Loaders). الرابطات الساكنة والديناميكية. المعالجات الدقيقة، ومشروع."],
["4711",1,"n","lab","Database Systems Lab","مختبر أنظمة قواعد البيانات","Practical sessions using the SQL interface of a DBMS (for example, ORACLE SQL*Plus): data manipulation language commands, data definition language commands, application development tools (for example, ORACLE Developer) and their connectivity to a database.","جلسات عملية باستخدام واجهة SQL لنظام إدارة قواعد بيانات (مثل ORACLE SQL*Plus): أوامر لغة معالجة البيانات وأوامر لغة تعريف البيانات، وأدوات تطوير التطبيقات (مثل ORACLE Developer) وربطها بقاعدة البيانات."],
["4712",3,"n","lec","Computer Networks","شبكات الحاسوب","Basic concepts of networking and data communication. Network types, topologies and architectures. Network components, client-server concepts. Network protocols. Network operating systems. LAN and WAN technologies. TCP/IP protocols and applications (routing, DNS, etc.). Projects and case studies.","المفاهيم الأساسية للشبكات واتصالات البيانات. أنواع الشبكات وطوبولوجياتها ومعمارياتها. مكونات الشبكة، مفاهيم الخادم والعميل. بروتوكولات الشبكات وأنظمة تشغيلها. تقنيات LAN وWAN. بروتوكولات TCP/IP وتطبيقاتها (التوجيه، DNS وغيرها). مشاريع ودراسات حالة."],
["4717",3,"p","lec","Special Topics in Computer Systems Engineering","مواضيع خاصة في هندسة أنظمة الحاسوب","Selected topics in computer systems engineering according to the interests of both students and staff.","مواضيع مختارة في هندسة أنظمة الحاسوب وفق اهتمامات الطلبة والهيئة التدريسية."],
["4916",3,"d","lec","Interfacing Techniques","تقنيات المواءمة والربط","Basic principles of interfacing, serial interfacing, parallel interfacing; programmable interfacing devices, interrupt interfacing, interfacing data converters (ADCs and DACs).","المبادئ الأساسية للمواءمة، المواءمة التسلسلية والمتوازية؛ أجهزة المواءمة القابلة للبرمجة، مواءمة المقاطعات، وربط محولات البيانات (ADC وDAC)."],
["4359",1,"p","proj","Introduction to Graduation Project","مقدمة مشروع التخرج","Studying and analyzing real scientific or technical problems and proposing a suitable technical solution. This part of the project work must include software and hardware, a cost study and complete numerical simulation if necessary.","دراسة وتحليل مشكلات علمية أو تقنية حقيقية واقتراح حل تقني مناسب. يجب أن يشمل هذا الجزء من المشروع البرمجيات والعتاد ودراسة التكلفة ومحاكاة عددية كاملة عند الحاجة."],
["4700",3,"e","lec","P.C. Applications","تطبيقات الحاسوب الشخصي","Electronic systems schematics, simulation, PCB layout. Data acquisition systems, programmable instrumentation systems.","المخططات الإلكترونية، المحاكاة، تصميم الدوائر المطبوعة (PCB). أنظمة جمع البيانات وأنظمة القياس القابلة للبرمجة."],
["4707",1,"d","lab","Advanced Microprocessors Lab","مختبر المعالجات الدقيقة المتقدمة","Experiments on 16-bit and 32-bit microprocessors. Memory and I/O interfacing. Microcontrollers and applications.","تجارب على معالجات 16-بت و32-بت. ربط الذاكرة والإدخال والإخراج. المتحكمات الدقيقة وتطبيقاتها."],
["4718",3,"p","lec","Industrial Automation","الأتمتة الصناعية","Introduces students to industrial automation: power electronics applications such as rectification and speed control of AC and DC drives; electrical machines and electrical drive applications, mechanical performance; introduction to Programmable Logic Controllers (PLC) and their fields of application.","تعريف الطلبة بمجال الأتمتة الصناعية: تطبيقات إلكترونيات القدرة مثل التقويم والتحكم بسرعة محركات التيار المتردد والمستمر؛ الآلات الكهربائية وتطبيقات المحركات، والأداء الميكانيكي؛ مقدمة في المتحكمات المنطقية القابلة للبرمجة (PLC) ومجالات تطبيقها."],
["4723",3,"n","lec","Advanced Database Systems","أنظمة قواعد البيانات المتقدمة","Study of advanced database models and languages, database design theory, transaction processing, recovery, concurrency, distributed and deductive databases, active databases, security and integrity.","دراسة نماذج ولغات قواعد البيانات المتقدمة، نظرية تصميم قواعد البيانات، معالجة المعاملات، الاسترداد، التزامن، قواعد البيانات الموزعة والاستنتاجية والنشطة، الأمن والتكامل."],
["4725",3,"s","lec","Visual Programming","البرمجة المرئية","Basics of visual and event-driven programming. Graphical user interface (GUI) design. A visual programming language such as Visual .NET, Visual C#, Java, or Visual C++ is selected and its main GUI controls, components and structure are explained.","أساسيات البرمجة المرئية والبرمجة المعتمدة على الأحداث. تصميم واجهات المستخدم الرسومية (GUI). يتم اختيار لغة برمجة مرئية مثل Visual .NET أو Visual C# أو Java أو Visual C++ وشرح عناصر التحكم والمكونات الرئيسية وبنيتها."],
["4360",3,"p","proj","Graduation Project","مشروع التخرج","In this part of the project, students must practically realize the idea described in the Introduction to Graduation Project course, which means students must build a technical model taking into account all restrictions discussed in the prerequisite course.","في هذا الجزء يجب على الطلبة تنفيذ الفكرة الموصوفة في مساق مقدمة مشروع التخرج عملياً، أي بناء نموذج تقني يراعي جميع القيود التي نوقشت في المساق السابق."],

    cr: "س.م", thCode: "الرقم", thName: "المساق", thCr: "الساعات", thType: "النوع", thArea: "المجال", thDesc: "الوصف", total: "المجموع",
    recTitle: "الوثيقة الرسمية",
    recLede: "وصف المساقات في هذه الصفحة مأخوذ من وثيقة صادرة ومصدّقة عبر الجهات التالية.",
    chain: [
      ["صادرة عن جامعة بوليتكنك فلسطين", "عمادة القبول والتسجيل، الخليل"],
      ["وزارة التربية والتعليم العالي", "دائرة تصديق الشهادات، دولة فلسطين، 18 تشرين الثاني 2025"],
      ["وزارة الخارجية والمغتربين", "الشؤون القنصلية، دولة فلسطين، 19 تشرين الثاني 2025"],
      ["سفارة رومانيا، القسم القنصلي", "تصديق، تل أبيب، تشرين الثاني 2025"]
    ],
    recBody: "تحمل النسخة الممسوحة ختم الجامعة وختم هيئة الاعتماد والجودة (AQAC) وأختام التصديق المذكورة. يمكن للمراجعين مقارنتها بالدليل أعلاه.",
    recBtn: "فتح الوثيقة الرسمية PDF",
    recNote: "أُجريت تصحيحات إملائية طفيفة في النص الإنجليزي لتسهيل القراءة. تبقى وثيقة PDF هي المرجع المعتمد.",
    foot: "محمد أبو عمر · هندسة أنظمة الحاسوب، جامعة بوليتكنك فلسطين",
    footUpd: "آخر تحديث: تشرين الأول 2026",
    email: "البريد الإلكتروني", github: "GitHub", linkedin: "LinkedIn", cv: "تحميل السيرة الذاتية", grad: "سنة التخرج",
    jump: "تصفح المساقات", code: "عرض الشيفرة"
  }
};

const state = { lang: "en", track: "all", kind: "all", q: "", view: "cards", expanded: false };
try { const s = localStorage.getItem("ppu-lang"); if (s === "ar" || s === "en") state.lang = s; } catch (e) {}
if (location.hash === "#ar") state.lang = "ar";

const ICON = {
  arrow: '<svg class="icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M18 6l-1.43 1.393L24.15 15H4v2h20.15l-7.58 7.573L18 26l10-10L18 6z"/></svg>',
  chev: '<svg class="icon chev" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 22L6 12l1.4-1.4 8.6 8.6 8.6-8.6L26 12z"/></svg>',
  check: '<svg class="icon ic" viewBox="0 0 32 32" aria-hidden="true"><path d="M14 21.414l-5-5.001L10.413 15 14 18.586 21.585 11 23 12.415l-9 8.999z"/><path d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2zm0 26a12 12 0 1 1 12-12 12 12 0 0 1-12 12z"/></svg>'
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const tx = v => v == null ? "" : (typeof v === "string" ? v : (v[state.lang] || v.en || ""));
const trackOf = id => TRACKS.find(t => t.id === id);
const sum = list => list.reduce((a, c) => a + c.cr, 0);
const TOTAL = sum(COURSES);

function renderStatic() {
  const L = T[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => { const v = L[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  ["en", "ar"].forEach(l => $("lang-" + l).setAttribute("aria-pressed", String(state.lang === l)));
  $("q").placeholder = state.lang === "ar" ? "مثال: شبكات، 4712، MOSFET" : "e.g. networks, 4712, MOSFET";

  const labs = COURSES.filter(c => c.kind !== "lec").length;
  $("facts").innerHTML = [[COURSES.length, L.fCourses], [TOTAL, L.fCredits], [labs, L.fLabs], [TRACKS.length, L.fAreas]]
    .map(([n, l]) => `<div class="fact"><b>${n}</b><span>${esc(l)}</span></div>`).join("");

  const links = [];
  links.push(`<a class="btn primary" href="#courses"><span>${esc(L.jump)}</span>${ICON.arrow}</a>`);
  if (PROFILE.cv) links.push(`<a class="btn tertiary" href="${esc(PROFILE.cv)}" target="_blank" rel="noopener">${esc(L.cv)}</a>`);
  if (PROFILE.github) links.push(`<a class="btn tertiary" href="${esc(PROFILE.github)}" target="_blank" rel="noopener">${esc(L.github)}</a>`);
  if (PROFILE.linkedin) links.push(`<a class="btn tertiary" href="${esc(PROFILE.linkedin)}" target="_blank" rel="noopener">${esc(L.linkedin)}</a>`);
  if (PROFILE.email) links.push(`<span class="btn static mono">${esc(PROFILE.email)}</span>`);
  if (PROFILE.gradYear) links.push(`<span class="btn static">${esc(L.grad)} ${esc(PROFILE.gradYear)}</span>`);
  $("links").innerHTML = links.join("");

  $("strengths").innerHTML = STRENGTHS.map(s => {
    const list = s.codes.map(code => COURSES.find(c => c.code === code));
    const [title, body] = s[state.lang];
    return `<article class="strength">
      <div class="meta">${list.length} ${esc(L.fCourses)} · ${sum(list)} ${esc(L.cr)}</div>
      <h3>${esc(title)}</h3><p>${esc(body)}</p>
      <div class="chips">${list.map(c => `<button class="chip" type="button" data-goto="${c.code}"><span class="code">${c.code}</span>${esc(c.name[state.lang])}</button>`).join("")}</div>
    </article>`;
  }).join("");

  renderProjects();

  $("chain").innerHTML = L.chain.map(([b, s]) => `<li>${ICON.check}<div><b>${esc(b)}</b><span>${esc(s)}</span></div></li>`).join("");
}

function renderProjects() {
  const L = T[state.lang];
  const out = [];
  const gp = PROFILE.gradProject;
  if (gp) {
    out.push(`<article class="project feature">
      <span class="tag blue">${esc(L.gpBadge)}</span>
      <h3>${esc(tx(gp.title))}</h3>
      ${gp.summary ? `<p>${esc(tx(gp.summary))}</p>` : ""}
      ${gp.role ? `<p class="lede">${esc(tx(gp.role))}</p>` : ""}
      ${gp.tools && gp.tools.length ? `<div class="chips">${gp.tools.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      ${gp.link ? `<div><a class="btn tertiary" href="${esc(gp.link)}" target="_blank" rel="noopener">${esc(L.code)}</a></div>` : ""}
    </article>`);
  } else if (PROFILE.showPlaceholders) {
    out.push(`<article class="project feature slot"><span class="tag blue">${esc(L.gpBadge)}</span><h3>${esc(L.gpSlotTitle)}</h3><ul>${L.gpSlotItems.map(i => `<li>${esc(i)}</li>`).join("")}</ul></article>`);
  }
  (PROFILE.projects || []).forEach(p => out.push(`<article class="project">
      <h3>${esc(tx(p.title))}</h3>
      ${p.summary ? `<p class="lede">${esc(tx(p.summary))}</p>` : ""}
      ${p.tools && p.tools.length ? `<div class="chips">${p.tools.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      ${p.link ? `<div><a class="btn tertiary" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(L.code)}</a></div>` : ""}
    </article>`));
  if (!(PROFILE.projects || []).length && PROFILE.showPlaceholders) {
    for (let i = 0; i < 2; i++) out.push(`<article class="project slot"><h3>${esc(L.pSlotTitle)}</h3><ul>${L.pSlotItems.map(x => `<li>${esc(x)}</li>`).join("")}</ul></article>`);
  }
  $("projects").innerHTML = out.join("");
  $("projects-section").hidden = out.length === 0;
}

function renderLedger() {
  const L = T[state.lang];
  $("ledger").setAttribute("aria-label", L.ledgerTitle);
  $("ledger").innerHTML = TRACKS.map(t => {
    const cr = sum(COURSES.filter(c => c.track === t.id));
    const on = state.track === t.id;
    return `<button type="button" data-track="${t.id}" style="--c:var(${t.c});flex:${cr} 1 0" aria-pressed="${on}" class="${state.track !== "all" && !on ? "dim" : ""}" title="${esc(t[state.lang])}: ${cr}" aria-label="${esc(t[state.lang])}: ${cr}"></button>`;
  }).join("");
  $("legend").innerHTML = TRACKS.map(t => {
    const list = COURSES.filter(c => c.track === t.id);
    const cr = sum(list);
    return `<button type="button" data-track="${t.id}" data-active="${state.track === t.id}" style="--c:var(${t.c})"><span class="sw"></span><span class="lbl">${esc(t[state.lang])}</span><span class="num">${cr} ${esc(L.cr)} · ${Math.round(cr / TOTAL * 100)}%</span></button>`;
  }).join("");
  $("trackpick").innerHTML = [`<button type="button" data-track="all" aria-pressed="${state.track === "all"}" style="--c:var(--muted)"><span class="sw"></span><span>${esc(L.all)}</span><span class="n">${COURSES.length}</span></button>`]
    .concat(TRACKS.map(t => `<button type="button" data-track="${t.id}" aria-pressed="${state.track === t.id}" style="--c:var(${t.c})"><span class="sw"></span><span>${esc(t[state.lang])}</span><span class="n">${COURSES.filter(c => c.track === t.id).length}</span></button>`)).join("");
  $("kindpick").innerHTML = ["all", "lec", "lab", "proj"].map(k => `<button type="button" data-kind="${k}" aria-pressed="${state.kind === k}">${esc(L[k])}</button>`).join("");
  $("viewpick").innerHTML = [["cards", L.viewCards], ["table", L.viewTable]].map(([v, l]) => `<button type="button" data-view="${v}" aria-pressed="${state.view === v}">${esc(l)}</button>`).join("");
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return COURSES.filter(c =>
    (state.track === "all" || c.track === state.track) &&
    (state.kind === "all" || c.kind === state.kind) &&
    (!q || [c.code, c.name.en, c.name.ar, c.desc.en, c.desc.ar].some(s => s.toLowerCase().includes(q)))
  ).sort((a, b) => TRACKS.findIndex(t => t.id === a.track) - TRACKS.findIndex(t => t.id === b.track) || a.order - b.order);
}

function renderList() {
  const L = T[state.lang];
  const list = filtered();
  $("count").textContent = L.count(list.length, sum(list));
  $("expand").textContent = state.expanded ? L.collapseAll : L.expandAll;
  $("expand").hidden = state.view !== "cards";
  if (!list.length) { $("out").innerHTML = `<div class="empty">${esc(L.none)}</div>`; return; }
  if (state.view === "table") {
    $("out").innerHTML = `<div class="tablewrap"><table>
      <thead><tr><th>${esc(L.thCode)}</th><th>${esc(L.thName)}</th><th class="num">${esc(L.thCr)}</th><th>${esc(L.thType)}</th><th>${esc(L.thArea)}</th><th>${esc(L.thDesc)}</th></tr></thead>
      <tbody>${list.map(c => { const t = trackOf(c.track); return `<tr id="c-${c.code}">
        <td class="code mono">${c.code}</td><td><b style="font-weight:500">${esc(c.name[state.lang])}</b></td><td class="num">${c.cr}</td>
        <td>${esc(L[c.kind])}</td><td style="--c:var(${t.c})"><span class="dot"></span>${esc(t[state.lang])}</td><td class="desc">${esc(c.desc[state.lang])}</td></tr>`; }).join("")}</tbody>
      <tfoot><tr><td>${esc(L.total)}</td><td>${list.length}</td><td class="num">${sum(list)}</td><td colspan="3"></td></tr></tfoot>
    </table></div>`;
    return;
  }
  $("out").innerHTML = `<div class="accordion">${list.map(c => { const t = trackOf(c.track); return `<details class="course" id="c-${c.code}" style="--c:var(${t.c})"${state.expanded ? " open" : ""}>
      <summary><span class="sw"></span><span class="code">${c.code}</span><span class="name">${esc(c.name[state.lang])}</span><span class="tag kind">${esc(L[c.kind])}</span><span class="cr">${c.cr} ${esc(L.cr)}</span>${ICON.chev}</summary>
      <div class="body"><p>${esc(c.desc[state.lang])}</p><span class="trk">${esc(t[state.lang])}</span></div>
    </details>`; }).join("")}</div>`;
}

function renderAll() { renderStatic(); renderLedger(); renderList(); }

document.addEventListener("click", e => {
  const lang = e.target.closest("[data-lang]");
  if (lang) { state.lang = lang.dataset.lang; try { localStorage.setItem("ppu-lang", state.lang); } catch (err) {} renderAll(); return; }
  const tr = e.target.closest("[data-track]");
  if (tr) {
    const id = tr.dataset.track;
    state.track = (state.track === id && id !== "all" && !tr.closest("#trackpick")) ? "all" : id;
    renderLedger(); renderList();
    if (!tr.closest("#trackpick")) $("courses").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    return;
  }
  const k = e.target.closest("[data-kind]");
  if (k) { state.kind = k.dataset.kind; renderLedger(); renderList(); return; }
  const v = e.target.closest("[data-view]");
  if (v) { state.view = v.dataset.view; renderLedger(); renderList(); return; }
  const g = e.target.closest("[data-goto]");
  if (g) {
    state.track = "all"; state.kind = "all"; state.q = ""; $("q").value = "";
    renderLedger(); renderList();
    const el = $("c-" + g.dataset.goto);
    if (el) {
      if (el.tagName === "DETAILS") el.open = true;
      el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    }
  }
});
$("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
$("expand").addEventListener("click", () => { state.expanded = !state.expanded; renderList(); });
$("reset").addEventListener("click", () => { state.track = "all"; state.kind = "all"; state.q = ""; $("q").value = ""; renderLedger(); renderList(); });

renderAll();
</script>

</body></html>
